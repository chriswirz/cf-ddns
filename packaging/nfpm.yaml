# nfpm config used by the GitHub Actions pipeline to build .deb and .rpm
# packages. ARCH and PKG_VERSION are supplied by the pipeline, which also stages
# the binary for the target architecture at packaging/cf-ddns (nfpm does not
# expand environment variables inside contents paths).
name: cf-ddns
arch: ${ARCH}
platform: linux
version: ${PKG_VERSION}
# Without this, nfpm parses the version as semver and re-renders it, which
# drops the zero padding: 0.1.0042 became 0.1.42 in the package while the tag
# and the binary inside it still said 0.1.0042. Keep the string as given.
version_schema: none
section: net
priority: optional
maintainer: cf-ddns maintainers
description: |
  Dynamic DNS client for Cloudflare. cf-ddns runs as a background service,
  checks this machine's public IP address on an interval, and updates the
  Cloudflare DNS records you list whenever the address changes. Supports both
  A and AAAA records, proxied records, and per-record TTLs.
homepage: https://github.com/chriswirz/cf-ddns
license: MIT
contents:
  - src: packaging/cf-ddns
    dst: /usr/bin/cf-ddns
    file_info:
      mode: 0755
  - src: README.md
    dst: /usr/share/doc/cf-ddns/README.md
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/cf-ddns/LICENSE
    file_info:
      mode: 0644
  - src: packaging/cf-ddns.service
    dst: /lib/systemd/system/cf-ddns.service
    file_info:
      mode: 0644
  # Config and token file are marked noreplace so an upgrade never clobbers
  # the operator's records or API token.
  - src: config.example.json
    dst: /etc/cf-ddns/config.json
    type: config|noreplace
    file_info:
      mode: 0640
  - src: packaging/cf-ddns.env
    dst: /etc/cf-ddns/cf-ddns.env
    type: config|noreplace
    file_info:
      mode: 0640

overrides:
  deb:
    depends:
      - adduser
  rpm:
    depends:
      - shadow-utils

scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh
